# ============================================================================
# Baykeep — Docker Compose Configuration
# Place this file in the project root directory (BAYKEEP/docker-compose.yml)
# Run with: docker compose up --build -d
# ============================================================================

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
    container_name: baykeep-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - ./inventory-backend/.env
    environment:
      - NODE_ENV=production
      - PORT=5000
      - CLIENT_URL=http://localhost:8080
    networks:
      - baykeep-network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend
      args:
        VITE_API_URL: http://localhost:5000/api
    container_name: baykeep-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - baykeep-network

networks:
  baykeep-network:
    driver: bridge